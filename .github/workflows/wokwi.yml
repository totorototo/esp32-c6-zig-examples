name: Build and simulate

# Builds every sample against its pinned MicroZig fork commit and runs it in Wokwi.
# Each sample prints a line that proves it works (most end with `<name> test: PASS`).
# Simulation needs the WOKWI_CLI_TOKEN secret (https://wokwi.com/dashboard/ci); without it,
# the samples are only built.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    strategy:
      fail-fast: false
      # Wokwi refuses connections when many simulations start at once.
      max-parallel: 2
      matrix:
        include:
          - sample: blinky
            # Logs go to USB-Serial-JTAG, which wokwi-cli doesn't show: build only.
            expect: ""
          - sample: boot
            timeout: 20000
            expect: "boot test: PASS"
          - sample: netatmo
            # Needs a Netatmo account's credentials: build and host tests only.
            expect: ""
          - sample: nvs
            timeout: 60000
            expect: "nvs test: PASS"
          - sample: oled
            timeout: 10000
            expect: "frame 50:"
          - sample: rmt
            timeout: 30000
            expect: "rmt test: PASS"
          - sample: tls
            # Reaches api.netatmo.com and pool.ntp.org through Wokwi-GUEST.
            timeout: 120000
            expect: "tls test: PASS"
          - sample: weblight
            timeout: 60000
            expect: "open http://"
          - sample: hue
            # The Hue bridge is on a LAN Wokwi's cloud can't reach: check that Wi-Fi is up.
            timeout: 60000
            expect: "(net) got address"
          - sample: wifinvs
            timeout: 90000
            expect: "wifinvs test: PASS"

    steps:
      # Actions pinned by commit: a tag can be moved to other code, a commit can't.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Build
        working-directory: ${{ matrix.sample }}
        # The first build after fetching MicroZig sometimes stops in regz; a second run works.
        run: zig build -Doptimize=ReleaseSmall || zig build -Doptimize=ReleaseSmall

      - name: Host tests
        working-directory: ${{ matrix.sample }}
        # Samples with pure parts (hue, netatmo, tls, weblight, oled) have a test step; each
        # runs its own and common's tests, in Debug and in ReleaseSmall.
        run: |
          if zig build -l | grep -q '^  test '; then zig build test --summary all; else echo "no host tests"; fi

      - name: Install wokwi-cli
        if: matrix.expect != '' && env.WOKWI_CLI_TOKEN != ''
        # A fixed release, checked against its hash, rather than whatever install.sh fetches.
        # To update: pick a release, download its linuxstatic-x64 binary, `sha256sum` it.
        env:
          WOKWI_CLI_VERSION: v0.29.1
          WOKWI_CLI_SHA256: 3c9d6da007d008a3822ab468318037285440055132c59fd659d7306e40f14258
        run: |
          mkdir -p "$HOME/.wokwi/bin"
          curl -fsSL -o "$HOME/.wokwi/bin/wokwi-cli" \
            "https://github.com/wokwi/wokwi-cli/releases/download/$WOKWI_CLI_VERSION/wokwi-cli-linuxstatic-x64"
          echo "$WOKWI_CLI_SHA256  $HOME/.wokwi/bin/wokwi-cli" | sha256sum -c -
          chmod +x "$HOME/.wokwi/bin/wokwi-cli"
          echo "$HOME/.wokwi/bin" >> "$GITHUB_PATH"

      - name: Simulate
        if: matrix.expect != '' && env.WOKWI_CLI_TOKEN != ''
        run: bash .github/scripts/wokwi-run.sh "${{ matrix.sample }}" "${{ matrix.timeout }}" "${{ matrix.expect }}"
