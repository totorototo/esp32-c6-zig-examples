<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weblight</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 3rem auto; padding: 0 1rem; text-align: center; }
  input[type=color] { width: 8rem; height: 8rem; border: none; background: none; cursor: pointer; }
  button { font-size: 1.1rem; padding: .5rem 1.5rem; margin: .5rem; cursor: pointer; }
  #st { font-family: ui-monospace, monospace; opacity: .7; }
</style>
<h1>weblight</h1>
<input type="color" id="c" value="#ff6000" aria-label="LED colour">
<div>
  <button onclick="set({ on: 1 })">On</button>
  <button onclick="set({ on: 0 })">Off</button>
</div>
<p id="st">…</p>
<script>
  const c = document.getElementById('c'), st = document.getElementById('st');
  const hex = (j) => '#' + [j.r, j.g, j.b].map((v) => v.toString(16).padStart(2, '0')).join('');
  const show = (j) => { st.textContent = (j.on ? 'on ' : 'off ') + hex(j); };
  function set(params) {
    fetch('/set?' + new URLSearchParams(params), { method: 'POST' })
      .then((r) => r.json()).then(show)
      .catch(() => { st.textContent = 'board not reachable'; });
  }
  // `change` fires when the picker closes, so dragging doesn't flood the single-threaded server.
  c.addEventListener('change', () => {
    const v = c.value;
    set({ on: 1, r: parseInt(v.slice(1, 3), 16), g: parseInt(v.slice(3, 5), 16), b: parseInt(v.slice(5, 7), 16) });
  });
  fetch('/state').then((r) => r.json()).then((j) => { c.value = hex(j); show(j); })
    .catch(() => { st.textContent = 'board not reachable'; });
</script>
</html>
