<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue remote</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 3rem auto; padding: 0 1rem; text-align: center; }
  input[type=color] { width: 7rem; height: 7rem; border: none; background: none; cursor: pointer; }
  input[type=range] { width: 100%; }
  button { font-size: 1.1rem; padding: .5rem 1.5rem; margin: .5rem; cursor: pointer; }
  label { display: block; margin: 1.2rem 0 .3rem; opacity: .8; }
  #st { font-family: ui-monospace, monospace; opacity: .7; }
  .hidden { display: none; }
</style>
<h1 id="name">Hue remote</h1>
<div>
  <button onclick="set({ on: 1 })">On</button>
  <button onclick="set({ on: 0 })">Off</button>
</div>
<div id="dim" class="hidden">
  <label for="bri">Brightness</label>
  <input type="range" id="bri" min="1" max="254">
</div>
<div id="col" class="hidden">
  <label for="c">Colour</label>
  <input type="color" id="c">
</div>
<p id="st">…</p>
<script>
  const $ = (id) => document.getElementById(id);

  // Hue's hue/sat (0..65535, 0..254) <-> the picker's #rrggbb, at full value.
  function toHex(hue, sat) {
    const h = (hue / 65535) * 6, s = sat / 254, f = h - Math.floor(h);
    const p = 1 - s, q = 1 - s * f, t = 1 - s * (1 - f);
    const [r, g, b] = [[1, t, p], [q, 1, p], [p, 1, t], [p, q, 1], [t, p, 1], [1, p, q]][Math.floor(h) % 6];
    return '#' + [r, g, b].map((v) => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
  }
  function fromHex(hex) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
    let h = 0;
    if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return { hue: Math.round((((h / 6) % 1) + 1) % 1 * 65535), sat: Math.round((max ? d / max : 0) * 254) };
  }

  function show(j) {
    $('name').textContent = j.name || 'Hue remote';
    document.title = j.name || 'Hue remote';
    $('dim').classList.toggle('hidden', j.bri === null);
    $('col').classList.toggle('hidden', j.hue === null);
    // Don't move a control the user is touching.
    if (j.bri !== null && document.activeElement !== $('bri')) $('bri').value = j.bri;
    if (j.hue !== null && document.activeElement !== $('c')) $('c').value = toHex(j.hue, j.sat);
    $('st').textContent = (j.reachable ? '' : 'unreachable, ') + (j.on ? 'on' : 'off') + (j.bri !== null ? `, ${Math.round(j.bri / 2.54)}%` : '');
  }
  const fail = () => { $('st').textContent = 'board not reachable'; };
  function set(params) {
    fetch('/set?' + new URLSearchParams(params), { method: 'POST', headers: { 'X-Hue-Remote': '1' } }).then((r) => r.json()).then(show).catch(fail);
  }
  const poll = () => fetch('/state').then((r) => r.json()).then(show).catch(fail);

  // `change` fires on release, so dragging doesn't flood the single-threaded board.
  $('bri').addEventListener('change', () => set({ on: 1, bri: $('bri').value }));
  $('c').addEventListener('change', () => set({ on: 1, ...fromHex($('c').value) }));
  poll();
  setInterval(poll, 5000);
</script>
</html>
